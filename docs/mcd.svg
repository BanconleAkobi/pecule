    <text x="1272" y="944">dernier_jour_reçu</text>
    <text x="1272" y="962">dernière_récupération</text>
    <text x="1375" y="998" class="note">XT : suit un actif ou une devise, jamais les deux</text>

    <!-- Associations -->
    <ellipse class="assoc" cx="155" cy="260" rx="50" ry="20"/>
    <text x="155" y="264" class="assoc-name">DÉFINIR</text>

    <ellipse class="assoc" cx="330" cy="270" rx="62" ry="20"/>
    <text x="330" y="274" class="assoc-name">SE TROMPER</text>

    <ellipse class="assoc" cx="715" cy="97" rx="68" ry="20"/>
    <text x="715" y="101" class="assoc-name">RENVOYER À</text>

    <ellipse class="assoc" cx="560" cy="300" rx="52" ry="28"/>
    <text x="560" y="297" class="assoc-name">VOIR</text>
    <text x="560" y="313" class="assoc-attr">date_vue</text>

    <ellipse class="assoc" cx="545" cy="475" rx="82" ry="28"/>
    <text x="545" y="472" class="assoc-name">METTRE EN FAVORI</text>
    <text x="545" y="488" class="assoc-attr">date_ajout</text>

    <ellipse class="assoc" cx="935" cy="304" rx="55" ry="20"/>
    <text x="935" y="308" class="assoc-name">ILLUSTRER</text>

    <ellipse class="assoc" cx="1145" cy="304" rx="80" ry="20"/>
    <text x="1145" y="308" class="assoc-name">AVOIR POUR COURS</text>

    <ellipse class="assoc" cx="1155" cy="478" rx="72" ry="20"/>
    <text x="1155" y="482" class="assoc-name">ÊTRE COTÉ EN</text>

    <ellipse class="assoc" cx="230" cy="640" rx="58" ry="20"/>
    <text x="230" y="644" class="assoc-name">EFFECTUER</text>

    <ellipse class="assoc" cx="740" cy="724" rx="62" ry="20"/>
    <text x="740" y="728" class="assoc-name">CONCERNER</text>

    <ellipse class="assoc" cx="100" cy="880" rx="66" ry="20"/>
    <text x="100" y="884" class="assoc-name">ENREGISTRER</text>

    <ellipse class="assoc" cx="900" cy="946" rx="52" ry="20"/>
    <text x="900" y="950" class="assoc-name">SIMULER</text>

    <ellipse class="assoc" cx="1120" cy="770" rx="45" ry="20"/>
    <text x="1120" y="774" class="assoc-name">SUIVRE</text>

    <ellipse class="assoc" cx="1310" cy="593" rx="62" ry="20"/>
    <text x="1310" y="597" class="assoc-name">DE BASE</text>

    <ellipse class="assoc" cx="1440" cy="593" rx="58" ry="20"/>
    <text x="1440" y="597" class="assoc-name">COTÉE</text>

    <ellipse class="assoc" cx="1530" cy="800" rx="45" ry="20"/>
    <text x="1530" y="804" class="assoc-name">SUIVRE</text>

    <!-- Cardinalities -->
    <text x="163" y="140" class="card">1,1</text>
    <text x="163" y="392" class="card">0,n</text>

    <text x="238" y="392" class="card">0,n</text>
    <text x="478" y="174" class="card">0,n</text>

    <text x="614" y="90" class="card">1,1</text>
    <text x="790" y="90" class="card">0,n</text>

    <text x="284" y="446" class="card">0,n</text>
    <text x="790" y="204" class="card">0,n</text>

    <text x="278" y="468" class="card">0,n</text>
    <text x="790" y="468" class="card">0,n</text>

    <text x="942" y="226" class="card">0,n</text>
    <text x="942" y="394" class="card">0,n</text>

    <text x="994" y="394" class="card">0,n</text>
    <text x="1338" y="226" class="card">(1,1)</text>

    <text x="1054" y="470" class="card">1,1</text>
    <text x="1232" y="470" class="card">0,n</text>

    <text x="238" y="532" class="card">0,n</text>
    <text x="370" y="688" class="card">1,1</text>

    <text x="866" y="552" class="card">0,n</text>
    <text x="634" y="716" class="card">1,1</text>

    <text x="108" y="532" class="card">0,n</text>
    <text x="370" y="934" class="card">1,1</text>

    <text x="946" y="552" class="card">0,n</text>
    <text x="636" y="938" class="card">1,1</text>

    <text x="1052" y="566" class="card">0,1</text>
    <text x="1224" y="916" class="card">0,1</text>

    <text x="1316" y="546" class="card">0,n</text>
    <text x="1316" y="652" class="card">(1,1)</text>
    <text x="1446" y="546" class="card">0,n</text>
    <text x="1446" y="652" class="card">(1,1)</text>

    <text x="1498" y="492" class="card">0,1</text>
    <text x="1498" y="952" class="card">0,1</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,1110)">
    <rect class="user" x="0" y="0" width="18" height="18"/>
    <text x="28" y="14" class="legend">Données de l'utilisateur · en base, jamais effacées automatiquement</text>
    <rect class="ref" x="520" y="0" width="18" height="18"/>
    <text x="548" y="14" class="legend">Référentiel · écrit dans le code ou le JSON des leçons</text>
    <rect class="cache" x="940" y="0" width="18" height="18"/>
    <text x="968" y="14" class="legend">Cache · en base, vidable à tout moment</text>
    <text x="0" y="48" class="legend">0,n : zéro à plusieurs · 1,1 : exactement un · 0,1 : zéro ou un · (1,1) : identifiant relatif, l'entité s'identifie avec celle d'en face</text>
  </g>
</svg>
