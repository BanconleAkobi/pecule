    <text x="832" y="86" class="id">id_leçon</text>
    <text x="832" y="104">numéro</text>
    <text x="832" y="122">titre</text>
    <text x="832" y="140">niveau</text>
    <text x="832" y="158">durée_min</text>
    <text x="832" y="176">contenu</text>
    <text x="832" y="194">action</text>

