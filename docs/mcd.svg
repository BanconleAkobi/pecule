<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <style>
    text { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 13px; fill: #1B1E17; }
    .page-title { font-size: 22px; font-weight: 700; }
    .page-sub { font-size: 13px; fill: #5C6152; }
    .box { fill: #FFFFFF; stroke: #1B1E17; stroke-width: 1.5; }
    .user { fill: #EEF3B0; stroke: #1B1E17; stroke-width: 1.5; }
    .ref { fill: #D6E8FF; stroke: #1B1E17; stroke-width: 1.5; }
    .cache { fill: #FBDDF1; stroke: #1B1E17; stroke-width: 1.5; }
    .ent-title { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .id { text-decoration: underline; font-weight: 600; }
    .link { stroke: #1B1E17; stroke-width: 1.3; fill: none; }
    .assoc { fill: #FFFFFF; stroke: #1B1E17; stroke-width: 1.5; }
    .assoc-name { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .assoc-attr { font-size: 12px; font-style: italic; text-anchor: middle; }
    .card { font-size: 12px; font-weight: 700; fill: #8A2D12; }
    .note { font-size: 12px; font-style: italic; fill: #5C6152; text-anchor: middle; }
    .legend { font-size: 13px; }
  </style>

  <rect width="1600" height="1200" fill="#FFFFFF"/>
  <text x="40" y="38" class="page-title">Pécule · Modèle conceptuel des données</text>
  <text x="40" y="60" class="page-sub">Notation Merise · identifiants soulignés · cardinalités lues depuis l'entité vers l'association</text>

  <g transform="translate(0,60)">

    <!-- Links, drawn first so shapes sit on top -->
    <line class="link" x1="155" y1="120" x2="155" y2="400"/>
    <polyline class="link" points="230,400 330,270 470,154"/>
    <line class="link" x1="610" y1="97" x2="820" y2="97"/>
    <polyline class="link" points="270,425 560,300 820,180"/>
    <line class="link" x1="270" y1="475" x2="820" y2="475"/>
    <line class="link" x1="935" y1="208" x2="935" y2="400"/>
    <polyline class="link" points="1020,400 1145,304 1330,208"/>
    <line class="link" x1="1050" y1="478" x2="1260" y2="478"/>
    <polyline class="link" points="230,514 230,640 400,700"/>
    <polyline class="link" points="860,532 740,724 630,724"/>
    <polyline class="link" points="100,514 100,880 400,946"/>
    <polyline class="link" points="940,532 900,946 630,946"/>
    <polyline class="link" points="1040,532 1120,770 1260,928"/>
    <line class="link" x1="1310" y1="526" x2="1310" y2="660"/>
    <line class="link" x1="1440" y1="526" x2="1440" y2="660"/>
    <polyline class="link" points="1490,470 1530,800 1490,928"/>

    <!-- PRÉFÉRENCE -->
    <rect class="box" x="40" y="40" width="230" height="80"/>
    <rect class="user" x="40" y="40" width="230" height="28"/>
    <text x="155" y="59" class="ent-title">PRÉFÉRENCE</text>
    <text x="52" y="86" class="id">clé</text>
    <text x="52" y="104">valeur</text>

    <!-- QUESTION -->
    <rect class="box" x="380" y="40" width="230" height="114"/>
    <rect class="ref" x="380" y="40" width="230" height="28"/>
    <text x="495" y="59" class="ent-title">QUESTION</text>
    <text x="392" y="86" class="id">numéro</text>
    <text x="392" y="104">intitulé</text>
    <text x="392" y="122">propositions</text>
    <text x="392" y="140">bonne_réponse</text>

    <!-- LEÇON -->
    <rect class="box" x="820" y="40" width="230" height="168"/>
    <rect class="ref" x="820" y="40" width="230" height="28"/>
