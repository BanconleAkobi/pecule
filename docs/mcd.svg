    <text x="412" y="686" class="id">id_achat</text>
    <text x="412" y="704">date_exécution</text>
    <text x="412" y="722">montant_eur</text>
    <text x="412" y="740">cours_unitaire</text>
    <text x="412" y="758">taux_eur_usd</text>
    <text x="412" y="776">quantité</text>
    <text x="412" y="794">date_création</text>

