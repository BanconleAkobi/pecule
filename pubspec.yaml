name: pecule
description: "Pécule : ton premier patrimoine, sans risque. Portefeuille fictif sur cours réels."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.4+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/instrument_serif/OFL.txt
    - assets/fonts/schibsted_grotesk/OFL.txt
    - assets/fonts/jetbrains_mono/OFL.txt

  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/instrument_serif/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/instrument_serif/InstrumentSerif-Italic.ttf
          style: italic
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500

# Icône de l'application : dart run flutter_launcher_icons
# app_icon.png est construite par tool/make_app_icon.swift.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#E2F24B"
  adaptive_icon_background: "#E2F24B"
  adaptive_icon_foreground: assets/icon/pecule_logo.png
  # Android découpe l'icône en cercle dans les 66 % du centre. Le logo
  # touche ses bords : avec 26 % de marge, ses coins tombent dans le cercle.
  adaptive_icon_foreground_inset: 26
